services:

  backend:
    build: .
    container_name: drf_auth_backend
    restart: always

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app
      - /home/shayanjr/.vscode/extensions:/root/.vscode-server/extensions

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - db
      - smtp4dev


  db:
    image: postgres:16

    container_name: drf_auth_db

    restart: always

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"


  smtp4dev:
    image: rnwood/smtp4dev:v3

    container_name: drf_auth_smtp

    restart: always

    ports:
      - "5000:80"
      - "2525:25"

    volumes:
      - smtp4dev_data:/smtp4dev


volumes:

  postgres_data:

  smtp4dev_data:
