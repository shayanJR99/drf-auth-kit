services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: drf_auth_backend

    restart: unless-stopped

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_started

      smtp:
        condition: service_started


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: drf_auth_frontend

    restart: unless-stopped

    command: npm run dev -- --host

    volumes:
      - ./frontend:/app
      - /app/node_modules

    ports:
      - "5173:5173"

    environment:
      CHOKIDAR_USEPOLLING: "true"

    depends_on:
      - backend


  db:
    image: postgres:16

    container_name: drf_auth_db

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"


  smtp:
    image: rnwood/smtp4dev:v3

    container_name: drf_auth_smtp

    restart: unless-stopped

    ports:
      - "5000:80"
      - "2525:25"

    volumes:
      - smtp_data:/smtp4dev


volumes:

  postgres_data:

  smtp_data: